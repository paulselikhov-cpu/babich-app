spring:
  application:
    name: babichChat
  datasource:
    url: jdbc:postgresql://localhost:5432/chatdb
    username: chatuser
    password: chatpass
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false  # отключаем — предотвращает случайные запросы к БД при рендеринге
    properties:
      hibernate:
        default_schema: public   # пока одна схема, потом разделим
  sql:
    init:
      mode: always   # ← добавь это

server:
  port: 8080

jwt:
  secret: "babich-super-secret-key-minimum-256-bits-long-for-hs256-algorithm"
  expiration: 86400000   # 24 часа в миллисекундах