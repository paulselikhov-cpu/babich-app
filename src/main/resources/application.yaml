spring:
  application:
    name: babichChat
  datasource:
    url: jdbc:postgresql://localhost:5432/chatdb
    username: chatuser
    password: chatpass
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    open-in-view: false  # отключаем — предотвращает случайные запросы к БД при рендеринге
    properties:
      hibernate:
        default_schema: public   # пока одна схема, потом разделим
    defer-datasource-initialization: true # чтобы сначала создались entity, потом запустился уже data.sql
  sql:
    init:
      mode: always   # ← добавь это

server:
  port: 8080
  address: 0.0.0.0
logging:
  level:
    com.platform: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG

jwt:
  secret: "babich-super-secret-key-minimum-256-bits-long-for-hs256-algorithm"
  expiration: 86400000   # 24 часа в миллисекундах
cors:
  allowed-origins:
    - http://localhost:4200
    - http://localhost:4201
    - http://localhost
    - http://192.168.0.*:*